import com.vanniktech.maven.publish.SonatypeHost

plugins {
    id 'java-library'
    id 'jacoco'
    id "com.vanniktech.maven.publish" version "0.31.0"
}

group = 'de.codebarista'
version = '3.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    testImplementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.2'
    testImplementation 'org.xmlunit:xmlunit-core:2.10.0'
    testImplementation 'org.xmlunit:xmlunit-assertj:2.10.0'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
}

mavenPublishing {
    pom {
        name.set("Gallop")
        description.set("Java library for creating XRechnung, ZUGFeRD and Factur-X electronic invoices")
        url.set("https://github.com/codebarista-de/gallop")

        licenses {
            license {
                name.set("MIT License")
                url.set("https://opensource.org/licenses/MIT")
            }
        }

        developers {
            developer {
                id.set("codebarista.de")
                name.set("Codebarista")
            }
        }

        scm {
            connection.set("scm:git:https://github.com/codebarista-de/gallop.git")
            developerConnection.set("scm:git:ssh://github.com/codebarista-de/gallop.git")
            url.set("https://github.com/codebarista-de/gallop")
        }
    }

    publishToMavenCentral(SonatypeHost.CENTRAL_PORTAL)

    // Only sign if publishing to Maven Central (not for local)
    if (project.hasProperty("signingInMemoryKeyId") || project.hasProperty("signing.keyId")) {
        signAllPublications()
    }
}

tasks.register('printVersion') {
    doLast {
        println project.version
    }
}
